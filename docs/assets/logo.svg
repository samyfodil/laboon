  <title
     id="title">Laboon — whale mascot and wordmark</title>
  <desc
     id="desc">Manually authored editable SVG paths based on the approved Laboon logo; no tracing, raster images, or fonts. No forehead scar or pupil glint.</desc>
  <defs
     id="defs4">
    <linearGradient
       id="whale-blue"
       x1="0"
       y1="0"
       x2="0.9"
       y2="1"
       gradientUnits="objectBoundingBox">
      <stop
         offset="0"
         stop-color="#032761"
         id="stop1" />
      <stop
         offset="1"
         stop-color="#002158"
         id="stop2" />
    </linearGradient>
    <linearGradient
       id="letter-blue"
       x1="0"
       y1="0"
       x2="0"
       y2="1">
      <stop
         offset="0"
         stop-color="#0860DD"
         id="stop3" />
      <stop
         offset="1"
         stop-color="#004CD1"
         id="stop4" />
    </linearGradient>
    <!-- The thin pectoral-fin separation is transparent, not painted white. -->
    <mask
       id="fin-cut"
       maskUnits="userSpaceOnUse"
       x="0"
       y="0"
       width="1254"
       height="1254">
      <rect
         x="0"
         y="0"
         width="1254"
         height="1254"
         fill="white"
         id="rect4" />
      <path
         d="M 345,903 C 368,860 418,830 468,828 C 422,841 377,875 349,920 C 345,913 343,909 345,903 Z"
         fill="black"
         id="path4" />
    </mask>
  </defs>
